name: Tag build check

# Verifies that a tagged commit actually builds. It deliberately doesn't publish
# anything and doesn't commit back to main: everything that lands in this repo is
# authored by the maintainer, and anything a workflow pushes is attributed to
# github-actions[bot] instead. Releases are cut from a maintainer's machine with
# `gh release create v<x> publish/Claudestrap.exe`, and version.txt is bumped by
# hand in the same commit as the csproj version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Claudestrap.sln

      - name: Publish
        run: >
          dotnet publish Bloxstrap/Claudestrap.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -o publish
